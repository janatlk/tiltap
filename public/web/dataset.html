<!DOCTYPE html>
<html lang="ru" data-theme="business">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Разметка аудио — вход</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 py-6 px-4">
<main class="max-w-3xl mx-auto">

  <div class="card bg-base-100 shadow-sm max-w-md mx-auto mt-10">
    <div class="card-body space-y-4">
      <h1 class="card-title">Вход</h1>
      <p class="text-sm opacity-70">
        Войдите под своим логином. Если логина ещё нет — попросите администратора завести его.
      </p>

      <label class="form-control">
        <span class="label-text text-xs">Логин</span>
        <input id="loginUser" class="input input-bordered w-full" autocomplete="username">
      </label>

      <label class="form-control">
        <span class="label-text text-xs">Пароль</span>
        <input id="loginPass" type="password" class="input input-bordered w-full" autocomplete="current-password">
      </label>

      <div id="loginError" class="alert alert-error text-sm hidden"></div>
      <button id="loginBtn" class="btn btn-primary">Войти</button>

      <p class="text-xs opacity-60">
        Первый раз здесь? Откройте <b>Инструкцию</b> вверху — там по шагам описано, что делать.
      </p>
    </div>
  </div>
</main>

<script src="/web/guard.js"></script>
<script src="/web/dataset-common.js"></script>
<script>
// Страницы, куда пускают только супер-админа. Список повторяет серверный:
// если вернуть сюда разметчика, сервер снова отправит его на вход, и человек
// будет ходить по кругу, вводя пароль, который каждый раз принимается.
const SUPER_ADMIN_ONLY = ["/web/admin.html", "/web/admin-beta-test.html"];

function requestedPage(role) {
  const next = new URLSearchParams(location.search).get("next");
  // Открытый редирект: без проверки сюда можно было бы подставить чужой адрес
  // и увести человека сразу после ввода пароля.
  if (!next || !next.startsWith("/web/")) return null;
  const path = next.split("?")[0].toLowerCase();
  if (SUPER_ADMIN_ONLY.indexOf(path) >= 0 && role !== "super_admin") return null;
  return next;
}

function nextUrl(role) {
  const next = requestedPage(role);
  if (next) return next;
  // Каждому своя начальная страница: супер-админ работает в админке, остальные
  // в разметке. Общая посадочная страница заставляла бы половину людей делать
  // лишний переход при каждом входе.
  return window.TilTapGuard.homeFor(role);
}

$("loginBtn").onclick = async () => {
  showError($("loginError"), "");
  const btn = $("loginBtn");
  btn.disabled = true;
  try {
    const result = await api("/api/dataset/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("loginUser").value.trim(),
        password: $("loginPass").value,
      }),
    });
    location.href = nextUrl(result.annotator && result.annotator.role);
  } catch (err) {
    showError($("loginError"), err.message);
    btn.disabled = false;
  }
};

[$("loginUser"), $("loginPass")].forEach((input) => {
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
});

(async () => {
  const session = await fetchSession();
  if (session.authenticated) {
    // Уже вошедшего отправляем туда, куда он шёл, а если он просто открыл
    // датасет — в сам датасет.
    //
    // Раньше здесь стоял тот же выбор по роли, что и после ввода пароля, и
    // супер-админа уносило в админку: открыть разметку он не мог вовсе, его
    // возвращало туда, откуда он пришёл. Выбор по роли уместен сразу после
    // входа, когда человек ещё не сказал, куда идёт; открыв эту страницу
    // намеренно, он это уже сказал.
    const role = session.annotator && session.annotator.role;
    location.href = requestedPage(role) || "/web/dataset-tasks.html";
    return;
  }
  mountChrome({ minimal: true });
  $("loginUser").focus();
})();
</script>
</body>
</html>
