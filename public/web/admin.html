<!DOCTYPE html>
<html lang="en" data-theme="business">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TilTap Admin — Translation Audit</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .text-box {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      max-height: 220px;
      overflow: auto;
    }
  </style>
</head>
<body class="min-h-screen bg-base-200 py-6 px-4">
  <div class="max-w-6xl mx-auto space-y-6">

    <header class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="text-3xl font-bold tracking-tight">TilTap Admin</h1>
      <div class="flex gap-2">
        <a href="/web/admin-beta-test.html" class="btn btn-sm btn-ghost">Beta STT Test</a>
        <a href="/web" class="btn btn-sm btn-ghost">Back to web UI</a>
      </div>
    </header>

    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <div class="flex flex-wrap gap-4 items-end" id="loginRow" style="display:none">
          <div class="form-control flex-1 min-w-[200px]">
            <label class="label" for="adminPassword"><span class="label-text">Пароль администратора</span></label>
            <input type="password" id="adminPassword" class="input input-bordered w-full" placeholder="пароль" autocomplete="current-password">
          </div>
          <button id="pwLoginBtn" class="btn btn-primary">Войти</button>
          <span class="text-sm" id="pwLoginNote"></span>
        </div>

        <div class="flex flex-wrap gap-4 items-end" id="tokenRow" style="display:none">
          <div class="form-control flex-1 min-w-[200px]">
            <label class="label" for="adminToken"><span class="label-text">Admin token <span class="text-error">*</span></span></label>
            <input type="text" id="adminToken" class="input input-bordered w-full" placeholder="TILTAB_ADMIN_TOKEN value">
          </div>
          <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        </div>

        <div class="flex flex-wrap gap-4 items-center" id="sessionRow" style="display:none">
          <span class="badge badge-success">Вы вошли</span>
          <button id="refreshBtn2" class="btn btn-primary btn-sm">Обновить</button>
          <button id="logoutBtn" class="btn btn-ghost btn-sm">Выйти</button>
        </div>
        <p class="text-sm text-base-content/70 mt-3">
          Translations are saved as <strong>Pending</strong> until confirmed. Confirmed entries are served from cache; rejected and error rows are preserved for audit.
        </p>
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <div class="flex flex-wrap gap-4 items-end">
          <div class="form-control flex-1 min-w-[200px]">
            <label class="label" for="requestSearch"><span class="label-text">Lookup request number</span></label>
            <input type="text" id="requestSearch" class="input input-bordered w-full" placeholder="e.g. 3248">
          </div>
          <button id="searchBtn" class="btn btn-outline">Search</button>
        </div>
        <div id="searchResult" class="mt-4"></div>
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <div role="tablist" class="tabs tabs-lift flex-wrap">
          <button role="tab" class="tab tab-active" data-tab="pending">Pending <span class="badge badge-sm badge-ghost ms-1" id="count-pending">0</span></button>
          <button role="tab" class="tab" data-tab="confirmed">Confirmed <span class="badge badge-sm badge-ghost ms-1" id="count-confirmed">0</span></button>
          <button role="tab" class="tab" data-tab="rejected">Rejected <span class="badge badge-sm badge-ghost ms-1" id="count-rejected">0</span></button>
          <button role="tab" class="tab" data-tab="errors">Errors <span class="badge badge-sm badge-ghost ms-1" id="count-errors">0</span></button>
          <button role="tab" class="tab" data-tab="web-jobs">STT Jobs <span class="badge badge-sm badge-ghost ms-1" id="count-web-jobs">0</span></button>
          <button role="tab" class="tab" data-tab="feedback">Feedback <span class="badge badge-sm badge-ghost ms-1" id="count-feedback">0</span></button>
          <button role="tab" class="tab" data-tab="live">Live <span class="badge badge-sm badge-ghost ms-1" id="count-live">0</span></button>
          <button role="tab" class="tab" data-tab="broadcast">Рассылка</button>
          <button role="tab" class="tab" data-tab="logs">Логи</button>
        </div>
        <div id="listContainer" class="mt-4">
          <div class="text-center text-base-content/60 py-12">Click "Refresh" to load translations.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast toast-end hidden z-50">
    <div class="alert" id="toastAlert">
      <span id="toastMsg"></span>
    </div>
  </div>

  <dialog id="loginModal" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Admin access required</h3>
      <p class="py-2 text-base-content/70">Enter the admin token to use this panel.</p>
      <div class="form-control mt-2">
        <input type="text" id="loginToken" class="input input-bordered w-full" placeholder="TILTAB_ADMIN_TOKEN value">
      </div>
      <div id="loginError" class="alert alert-error hidden text-sm mt-3" role="alert"></div>
      <div class="modal-action">
        <button id="loginBtn" class="btn btn-primary">Enter</button>
      </div>
    </div>
  </dialog>

  <script>
    const API = "";
    const adminToken = document.getElementById("adminToken");
    const loginToken = document.getElementById("loginToken");
    const loginModal = document.getElementById("loginModal");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const refreshBtn = document.getElementById("refreshBtn");
    const listContainer = document.getElementById("listContainer");
    const toast = document.getElementById("toast");
    const toastAlert = document.getElementById("toastAlert");
    const toastMsg = document.getElementById("toastMsg");
    const tabs = document.querySelectorAll("[role='tablist'] .tab");
    const requestSearch = document.getElementById("requestSearch");
    const searchBtn = document.getElementById("searchBtn");
    const searchResult = document.getElementById("searchResult");

    let currentTab = "pending";

    function getStoredToken() {
      return localStorage.getItem("tiltab_admin_token") || "";
    }

    function setToken(token) {
      adminToken.value = token;
      loginToken.value = token;
      localStorage.setItem("tiltab_admin_token", token);
    }

    const initialToken = getStoredToken();
    if (initialToken) setToken(initialToken);

    function requireToken() {
      if (!adminToken.value.trim()) {
        loginModal.showModal();
        return false;
      }
      loginModal.close();
      return true;
    }

    adminToken.addEventListener("change", () => {
      setToken(adminToken.value);
      requireToken();
    });

    loginBtn.addEventListener("click", () => {
      const token = loginToken.value.trim();
      if (!token) {
        loginError.classList.remove("hidden");
        loginError.textContent = "Token is required.";
        return;
      }
      setToken(token);
      requireToken();
      loadTab(currentTab);
    });

    loginToken.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });

    function showToast(msg, isError) {
      toastMsg.textContent = msg;
      toastAlert.className = "alert " + (isError ? "alert-error" : "alert-success");
      toast.classList.remove("hidden");
      setTimeout(() => { toast.classList.add("hidden"); }, 3000);
    }

    async function apiFetch(path, opts = {}) {
      const headers = opts.headers || {};
      // Send the token when there is one; the session cookie covers the rest.
      if (adminToken && adminToken.value) {
        headers["X-Admin-Token"] = adminToken.value;
      }
      return fetch(API + path, { ...opts, headers, credentials: "same-origin" });
    }

    let liveInterval = null;


    // ----- Рассылка -------------------------------------------------------
    function escapeHtmlAdmin(t) {
      return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function loadBroadcast() {
      const res = await apiFetch("/api/admin/broadcast");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Не удалось загрузить");

      const history = (data.history || []).map((b) => `
        <tr>
          <td class="text-xs whitespace-nowrap">${new Date(b.created_at).toLocaleString("ru")}</td>
          <td class="text-xs">${escapeHtmlAdmin(String(b.text).slice(0, 90))}</td>
          <td class="text-xs whitespace-nowrap">${b.sent} из ${b.total}${b.blocked ? ` · ${b.blocked} заблокировали` : ""}${b.failed ? ` · ${b.failed} ошибок` : ""}</td>
        </tr>`).join("") || '<tr><td colspan="3" class="text-xs opacity-60">Рассылок ещё не было</td></tr>';

      listContainer.innerHTML = `
        <div class="card bg-base-100 shadow-sm mb-4">
          <div class="card-body gap-3">
            <h2 class="card-title text-lg">Сообщение всем пользователям бота</h2>
            <p class="text-sm opacity-70">Получателей: <b>${data.recipients}</b>. Отправку нельзя отменить — сначала проверьте на себе.</p>
            <textarea id="bcText" class="textarea textarea-bordered w-full" rows="6" placeholder="Текст сообщения. Поддерживается HTML: &lt;b&gt;жирный&lt;/b&gt;, &lt;i&gt;курсив&lt;/i&gt;"></textarea>
            <div class="flex flex-wrap gap-2">
              <button class="btn btn-sm" id="bcTest">Отправить себе</button>
              <button class="btn btn-sm btn-error" id="bcSend">Отправить всем (${data.recipients})</button>
            </div>
            <div id="bcResult" class="text-sm"></div>
          </div>
        </div>
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <h3 class="font-semibold mb-2">Что уже отправляли</h3>
            <div class="overflow-x-auto"><table class="table table-sm"><tbody>${history}</tbody></table></div>
          </div>
        </div>`;

      const say = (html) => { document.getElementById("bcResult").innerHTML = html; };

      async function send(testOnly) {
        const text = document.getElementById("bcText").value.trim();
        if (!text) { say('<span class="text-error">Сначала напишите текст</span>'); return; }
        if (!testOnly) {
          const ok = confirm(`Отправить это сообщение ${data.recipients} пользователям?

Отменить будет нельзя.`);
          if (!ok) return;
        }
        say("Отправляю…");
        const res = await apiFetch("/api/admin/broadcast", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, testOnly }),
        });
        const r = await res.json();
        if (!res.ok) { say(`<span class="text-error">${escapeHtmlAdmin(r.error || "Ошибка")}</span>`); return; }
        say(`<span class="text-success">Доставлено ${r.sent} из ${r.total}</span>` +
            (r.blocked ? ` · ${r.blocked} заблокировали бота` : "") +
            (r.failed ? ` · <span class="text-error">${r.failed} ошибок</span>` : ""));
        if (!testOnly) setTimeout(() => loadTab("broadcast"), 1200);
      }

      document.getElementById("bcTest").onclick = () => send(true);
      document.getElementById("bcSend").onclick = () => send(false);
    }

    // ----- Логи -----------------------------------------------------------
    async function loadLogs(service, level, search) {
      const params = new URLSearchParams({
        service: service || "tiltab-backend",
        level: level || "all",
        lines: "300",
      });
      if (search) params.set("search", search);

      const res = await apiFetch("/api/admin/logs?" + params);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Не удалось прочитать журнал");

      const colour = (l) => l === "error" ? "text-error" : l === "warn" ? "text-warning" : "opacity-80";
      const rows = data.entries.map((e) => `
        <tr class="align-top">
          <td class="text-xs whitespace-nowrap opacity-60">${e.time ? new Date(e.time).toLocaleTimeString("ru") : ""}</td>
          <td class="text-xs whitespace-nowrap ${colour(e.level)}">${escapeHtmlAdmin(e.level)}</td>
          <td class="text-xs font-mono">${escapeHtmlAdmin(e.message)}</td>
        </tr>`).join("") || '<tr><td colspan="3" class="text-xs opacity-60">Записей нет</td></tr>';

      const opts = (data.services || []).map((s) =>
        `<option value="${s}" ${s === data.service ? "selected" : ""}>${s}</option>`).join("");

      listContainer.innerHTML = `
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body gap-3">
            <div class="flex flex-wrap gap-2 items-end">
              <select id="logService" class="select select-bordered select-sm">${opts}</select>
              <select id="logLevel" class="select select-bordered select-sm">
                <option value="all" ${level === "all" || !level ? "selected" : ""}>Все</option>
                <option value="warn" ${level === "warn" ? "selected" : ""}>Предупреждения и ошибки</option>
                <option value="error" ${level === "error" ? "selected" : ""}>Только ошибки</option>
              </select>
              <input id="logSearch" class="input input-bordered input-sm" placeholder="Поиск по тексту" value="${escapeHtmlAdmin(search || "")}">
              <button class="btn btn-sm" id="logReload">Обновить</button>
            </div>
            <div class="overflow-x-auto max-h-[70vh] overflow-y-auto">
              <table class="table table-xs"><tbody>${rows}</tbody></table>
            </div>
          </div>
        </div>`;

      const reload = () => loadLogs(
        document.getElementById("logService").value,
        document.getElementById("logLevel").value,
        document.getElementById("logSearch").value.trim()
      );
      document.getElementById("logReload").onclick = reload;
      document.getElementById("logService").onchange = reload;
      document.getElementById("logLevel").onchange = reload;
      document.getElementById("logSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") reload(); });
    }

    async function loadTab(tab) {
      currentTab = tab;
      stopLivePolling();
      if (!requireToken()) return;

      tabs.forEach((btn) => btn.classList.toggle("tab-active", btn.dataset.tab === tab));
      listContainer.innerHTML = '<div class="text-center text-base-content/60 py-12">Loading...</div>';

      try {
        if (tab === "broadcast") {
          await loadBroadcast();
          return;
        }
        if (tab === "logs") {
          await loadLogs("tiltab-backend", "all", "");
          return;
        }
        if (tab === "live") {
          await loadLiveProcesses();
          startLivePolling();
          return;
        }
        const endpoint =
          tab === "web-jobs" ? `/api/admin/web-jobs?limit=100`
          : tab === "feedback" ? `/api/admin/feedback?limit=100`
          : `/api/admin/translations/${tab}?limit=100`;
        const res = await apiFetch(endpoint);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        document.getElementById(`count-${tab}`).textContent = data.count || 0;
        if (tab === "web-jobs") {
          renderWebJobs(data.items || []);
        } else if (tab === "feedback") {
          renderFeedback(data.items || [], data.stats || { up: 0, down: 0, issue: 0, total: 0 });
        } else {
          renderList(tab, data.items || []);
        }
      } catch (err) {
        listContainer.innerHTML = `<div class="text-center text-error py-12">${escapeHtml(err.message)}</div>`;
      }
    }

    function startLivePolling() {
      stopLivePolling();
      liveInterval = setInterval(loadLiveProcesses, 3000);
    }

    function stopLivePolling() {
      if (liveInterval) {
        clearInterval(liveInterval);
        liveInterval = null;
      }
    }

    async function loadLiveProcesses() {
      try {
        const res = await apiFetch("/api/admin/processes");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        renderLiveProcesses(data);
      } catch (err) {
        listContainer.innerHTML = `<div class="text-center text-error py-12">${escapeHtml(err.message)}</div>`;
        stopLivePolling();
      }
    }

    function statusBadgeClass(status) {
      switch (status) {
        case "pending": return "badge-warning";
        case "confirmed": return "badge-success";
        case "rejected": return "badge-error";
        case "error": return "badge-error";
        case "running": return "badge-info";
        default: return "badge-ghost";
      }
    }

    function renderList(tab, items) {
      if (!items.length) {
        listContainer.innerHTML = '<div class="text-center text-base-content/60 py-12">No entries in this tab.</div>';
        return;
      }
      listContainer.innerHTML = "";
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";
        div.dataset.hash = item.sourceHash;
        div.dataset.lang = item.targetLang;

        const dateField = tab === "confirmed" ? item.confirmedAt : tab === "rejected" ? item.rejectedAt : tab === "errors" ? item.errorAt : item.createdAt;
        const actor = tab === "confirmed" ? item.confirmedBy : tab === "rejected" ? item.rejectedBy : "";
        const sourceLink = item.sourceUrl
          ? `<a class="link link-primary break-all" href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(item.sourceUrl)}</a>`
          : `<em class="text-base-content/50">No source link</em>`;

        let actionsHtml = "";
        if (tab === "pending") {
          actionsHtml = `
            <button class="btn btn-sm btn-success confirm-btn">Confirm</button>
            <button class="btn btn-sm btn-error btn-outline reject-btn">Reject</button>
          `;
        } else if (tab === "confirmed" || tab === "rejected") {
          actionsHtml = `
            ${tab === "rejected" ? '<button class="btn btn-sm btn-success confirm-btn">Confirm</button>' : ''}
            <button class="btn btn-sm btn-ghost delete-btn">Delete from audit</button>
          `;
        } else if (tab === "errors") {
          actionsHtml = `
            <button class="btn btn-sm btn-success retry-btn">Retry confirm</button>
            <button class="btn btn-sm btn-error btn-outline reject-btn">Reject</button>
          `;
        }

        const langPair = `${(item.sourceLang || "auto").toUpperCase()} → ${item.targetLang.toUpperCase()}`;
        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="badge badge-sm ${statusBadgeClass(item.status)}">${item.status.toUpperCase()}</span>
              ${item.requestNumber ? `<span class="badge badge-sm badge-ghost" title="Public request number">#${item.requestNumber}</span>` : ""}
              <span class="badge badge-sm badge-ghost" title="Source → Target">${escapeHtml(langPair)}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.provider)}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.model)}</span>
              <span class="badge badge-sm badge-ghost">${item.sourceType || "unknown"}</span>
              <span class="badge badge-sm badge-ghost">${new Date(dateField).toLocaleString()}</span>
              ${actor ? `<span class="badge badge-sm badge-ghost">by ${escapeHtml(actor)}</span>` : ""}
            </div>
            <div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Source</label>${escapeHtml(item.sourceText)}</div>
            ${tab !== "errors" ? `<label class="label-text text-xs uppercase opacity-70 block mb-1">Translation ${tab === "pending" ? "(edit before confirming if needed)" : ""}</label>` : ""}
            ${tab !== "errors" ? `<textarea class="textarea textarea-bordered w-full mb-3 translation-text">${escapeHtml(item.translatedText)}</textarea>` : ""}
            ${tab === "errors" ? `<div class="bg-error/10 text-error rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Error</label>${escapeHtml(item.errorMessage || "Unknown error")}</div>` : ""}
            <div class="text-xs text-base-content/60 mb-3">Source link: ${sourceLink}</div>
            <div class="flex flex-wrap gap-2">${actionsHtml}</div>
          </div>
        `;

        if (tab === "pending" || tab === "errors" || tab === "rejected") {
          const confirmBtn = div.querySelector(".confirm-btn");
          if (confirmBtn) confirmBtn.addEventListener("click", () => confirmItem(div));
        }
        if (tab === "pending" || tab === "errors") {
          div.querySelector(".reject-btn")?.addEventListener("click", () => rejectItem(div));
        }
        if (tab === "confirmed" || tab === "rejected") {
          div.querySelector(".delete-btn")?.addEventListener("click", () => deleteItem(div));
        }

        listContainer.appendChild(div);
      });
    }

    async function rejectItem(div) {
      if (!confirm("Reject this translation? It will be kept in the Rejected tab and not served from cache.")) return;
      const hash = div.dataset.hash;
      const lang = div.dataset.lang;
      const btn = div.querySelector(".reject-btn");
      btn.disabled = true;
      btn.textContent = "Rejecting...";
      try {
        const res = await apiFetch(`/api/admin/translations/${encodeURIComponent(hash)}/${encodeURIComponent(lang)}/reject`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rejectedBy: "web-admin" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Reject failed");
        showToast("Translation rejected");
        loadTab(currentTab);
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Reject";
      }
    }

    async function confirmItem(div) {
      const hash = div.dataset.hash;
      const lang = div.dataset.lang;
      const text = div.querySelector(".translation-text")?.value;
      const btn = div.querySelector(".confirm-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const res = await apiFetch(`/api/admin/translations/${encodeURIComponent(hash)}/${encodeURIComponent(lang)}/confirm`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ translatedText: text, confirmedBy: "web-admin" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Confirm failed");
        showToast("Translation confirmed");
        loadTab(currentTab);
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Confirm";
      }
    }

    async function deleteItem(div) {
      if (!confirm("Permanently delete this audit row? This cannot be undone.")) return;
      const hash = div.dataset.hash;
      const lang = div.dataset.lang;
      const btn = div.querySelector(".delete-btn");
      btn.disabled = true;
      btn.textContent = "Deleting...";
      try {
        const res = await apiFetch(`/api/admin/translations/${encodeURIComponent(hash)}/${encodeURIComponent(lang)}`, {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Delete failed");
        showToast("Row deleted");
        loadTab(currentTab);
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Delete from audit";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatSegments(segments) {
      if (!Array.isArray(segments) || segments.length === 0) return "";
      return segments.map((s) => `[${formatTime(s.start)} → ${formatTime(s.end)}] ${s.text}`).join("\n");
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
    }

    function renderLiveProcesses(data) {
      const webJobs = data.webJobs || [];
      const telegramProcesses = data.telegramProcesses || [];
      const remoteStt = data.remoteStt || { pending: 0, running: false };
      const total = webJobs.length + telegramProcesses.length + (remoteStt.running || remoteStt.pending ? 1 : 0);
      document.getElementById("count-live").textContent = total;

      listContainer.innerHTML = "";

      const summary = document.createElement("div");
      summary.className = "card card-compact bg-base-200 mb-4";
      summary.innerHTML = `
        <div class="card-body">
          <div class="flex flex-wrap gap-2">
            <span class="badge badge-sm badge-info">LIVE</span>
            <span class="badge badge-sm badge-ghost">Web: ${webJobs.length}</span>
            <span class="badge badge-sm badge-ghost">Telegram: ${telegramProcesses.length}</span>
            <span class="badge badge-sm badge-ghost">Remote STT: ${remoteStt.pending} pending${remoteStt.running ? ", running" : ""}</span>
            <span class="badge badge-sm badge-ghost">Updated: ${new Date(data.timestamp).toLocaleTimeString()}</span>
          </div>
        </div>
      `;
      listContainer.appendChild(summary);

      if (webJobs.length === 0 && telegramProcesses.length === 0 && !remoteStt.running && remoteStt.pending === 0) {
        const empty = document.createElement("div");
        empty.className = "text-center text-base-content/60 py-12";
        empty.textContent = "No active processes right now.";
        listContainer.appendChild(empty);
        return;
      }

      webJobs.forEach((job) => {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";
        const langPair = `${(job.sourceLang || "auto").toUpperCase()} → ${(job.targetLang || "-").toUpperCase()}`;
        const elapsed = Date.now() - job.createdAt;
        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-2">
              <span class="badge badge-sm ${statusBadgeClass(job.status)}">${job.status.toUpperCase()}</span>
              <span class="badge badge-sm badge-ghost">WEB</span>
              ${job.requestNumber ? `<span class="badge badge-sm badge-ghost">#${job.requestNumber}</span>` : ""}
              <span class="badge badge-sm badge-ghost">${escapeHtml(langPair)}</span>
              <span class="badge badge-sm badge-ghost">${job.type}</span>
              <span class="badge badge-sm badge-ghost">${formatDuration(elapsed)}</span>
            </div>
            <div class="text-sm mb-1">
              ${job.filename ? `File: <b>${escapeHtml(job.filename)}</b>` : ""}
              ${job.sourceUrl ? `URL: <a class="link link-primary break-all" href="${escapeHtml(job.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(job.sourceUrl)}</a>` : ""}
            </div>
            <div class="text-sm text-base-content/60">${escapeHtml(job.progress?.label || "")} · ${Math.round(job.progress?.percent || 0)}% ${job.pid ? `· PID ${job.pid}` : ""}</div>
            ${job.provider || job.model || job.gpu ? `
              <div class="flex flex-wrap gap-2 mt-2">
                ${job.provider ? `<span class="badge badge-sm badge-ghost">${escapeHtml(job.provider)}</span>` : ""}
                ${job.model ? `<span class="badge badge-sm badge-ghost">${escapeHtml(job.model)}</span>` : ""}
                ${job.gpu ? `<span class="badge badge-sm badge-accent">GPU: ${escapeHtml(job.gpu)}</span>` : ""}
              </div>
            ` : ""}
          </div>
        `;
        listContainer.appendChild(div);
      });

      telegramProcesses.forEach((proc) => {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";
        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-2">
              <span class="badge badge-sm badge-info">RUNNING</span>
              <span class="badge badge-sm badge-ghost">TG</span>
              <span class="badge badge-sm badge-ghost">Chat ${proc.chatId}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(proc.type.toUpperCase())}</span>
              <span class="badge badge-sm badge-ghost">${(proc.language || "auto").toUpperCase()}</span>
              <span class="badge badge-sm badge-ghost">${formatDuration(proc.durationMs)}</span>
            </div>
            <div class="text-sm mb-1">
              ${proc.filename ? `File: <b>${escapeHtml(proc.filename)}</b>` : ""}
              ${proc.sourceUrl ? `URL: <a class="link link-primary break-all" href="${escapeHtml(proc.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(proc.sourceUrl)}</a>` : ""}
            </div>
            ${proc.pid ? `<div class="text-sm text-base-content/60">PID ${proc.pid}</div>` : ""}
          </div>
        `;
        listContainer.appendChild(div);
      });

      if (remoteStt.running || remoteStt.pending > 0) {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";
        const current = remoteStt.current;
        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-2">
              <span class="badge badge-sm ${remoteStt.running ? "badge-info" : "badge-warning"}">${remoteStt.running ? "RUNNING" : "PENDING"}</span>
              <span class="badge badge-sm badge-ghost">REMOTE STT</span>
              <span class="badge badge-sm badge-ghost">${remoteStt.pending} in queue</span>
            </div>
            ${current ? `<div class="text-sm">Current: <b>${escapeHtml(current.filename)}</b> · ${(current.language || "auto").toUpperCase()} · ${formatDuration(Date.now() - new Date(current.startedAt).getTime())}</div>` : ""}
          </div>
        `;
        listContainer.appendChild(div);
      }
    }

    function formatDuration(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return `${h}h ${m % 60}m`;
      if (m > 0) return `${m}m ${s % 60}s`;
      return `${s}s`;
    }

    function renderWebJobs(items) {
      if (!items.length) {
        listContainer.innerHTML = '<div class="text-center text-base-content/60 py-12">No STT jobs yet.</div>';
        return;
      }
      listContainer.innerHTML = "";
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";
        const langPair = `${(item.sourceLang || "auto").toUpperCase()} → ${(item.targetLang || "-").toUpperCase()}`;
        const dateField = item.completedAt || item.updatedAt || item.createdAt;
        const sourceLink = item.sourceUrl
          ? `<a class="link link-primary break-all" href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(item.sourceUrl)}</a>`
          : `<em class="text-base-content/50">No source link</em>`;

        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="badge badge-sm ${statusBadgeClass(item.status)}">${item.status.toUpperCase()}</span>
              ${item.requestNumber ? `<span class="badge badge-sm badge-ghost" title="Public request number">#${item.requestNumber}</span>` : ""}
              <span class="badge badge-sm badge-ghost" title="Source → Target">${escapeHtml(langPair)}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.provider || "-")}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.model || "-")}</span>
              ${item.gpu ? `<span class="badge badge-sm badge-accent" title="GPU">${escapeHtml(item.gpu)}</span>` : ""}
              <span class="badge badge-sm badge-ghost">${item.sourceType || "unknown"}</span>
              <span class="badge badge-sm badge-ghost">${new Date(dateField).toLocaleString()}</span>
            </div>
            ${item.filename ? `<div class="text-xs text-base-content/60 mb-2">File: ${escapeHtml(item.filename)}</div>` : ""}
            ${item.fullText ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Transcription</label>${escapeHtml(item.fullText)}</div>` : ""}
            ${item.segments && item.segments.length ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Segments</label>${escapeHtml(formatSegments(item.segments))}</div>` : ""}
            ${item.status === "failed" ? `<div class="bg-error/10 text-error rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Error</label>${escapeHtml(item.errorMessage || "Unknown error")}</div>` : ""}
            <div class="text-xs text-base-content/60">Source link: ${sourceLink}</div>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    const FEEDBACK_CATEGORY_LABELS = {
      stt: "Bad transcription",
      translation: "Bad translation",
      download: "Download problem",
      speed: "Too slow",
      other: "Other",
    };

    function renderFeedback(items, stats) {
      // Satisfaction rate is the number the panel exists for — show it first,
      // and keep it visible even when there are no entries yet.
      const rate = stats.total ? Math.round((stats.up / stats.total) * 100) : null;
      const summary = `
        <div class="stats stats-horizontal bg-base-200 mb-4 w-full">
          <div class="stat"><div class="stat-title">👍 Positive</div><div class="stat-value text-success text-3xl">${stats.up}</div></div>
          <div class="stat"><div class="stat-title">👎 Negative</div><div class="stat-value text-error text-3xl">${stats.down}</div></div>
          <div class="stat"><div class="stat-title">🛠 Problem reports</div><div class="stat-value text-warning text-3xl">${stats.issue || 0}</div><div class="stat-desc">free-text, not a rating</div></div>
          <div class="stat"><div class="stat-title">Satisfaction</div><div class="stat-value text-3xl">${rate === null ? "—" : rate + "%"}</div><div class="stat-desc">${stats.total} ratings total</div></div>
        </div>
      `;

      if (!items.length) {
        listContainer.innerHTML = summary + '<div class="text-center text-base-content/60 py-12">No feedback yet.</div>';
        return;
      }

      listContainer.innerHTML = summary;
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "card card-compact bg-base-200 mb-4";

        const who = item.source === "telegram"
          ? [item.telegramName, item.telegramUsername ? "@" + item.telegramUsername : null].filter(Boolean).join(" ")
            || (item.telegramChatId ? "chat " + item.telegramChatId : "")
          : (item.webClientId || "");
        const langPair = item.sourceLang || item.targetLang
          ? `${(item.sourceLang || "auto").toUpperCase()} → ${(item.targetLang || "-").toUpperCase()}`
          : null;
        const sourceLink = item.sourceUrl
          ? `<a class="link link-primary break-all" href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(item.sourceUrl)}</a>`
          : "";

        div.innerHTML = `
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="badge badge-sm ${item.rating === "up" ? "badge-success" : item.rating === "issue" ? "badge-warning" : "badge-error"}">${item.rating === "up" ? "👍 GOOD" : item.rating === "issue" ? "🛠 PROBLEM" : "👎 POOR"}</span>
              ${item.requestNumber ? `<span class="badge badge-sm badge-ghost" title="Public request number">#${item.requestNumber}</span>` : ""}
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.source)}</span>
              ${item.rating === "issue" && item.status && item.status !== "new" ? `<span class="badge badge-sm ${item.status === "resolved" ? "badge-success" : "badge-warning"}">${item.status === "resolved" ? "✓ решено" : "⏳ отложено"}</span>` : ""}
              ${item.category ? `<span class="badge badge-sm badge-warning">${escapeHtml(FEEDBACK_CATEGORY_LABELS[item.category] || item.category)}</span>` : ""}
              ${langPair ? `<span class="badge badge-sm badge-ghost" title="Source → Target">${escapeHtml(langPair)}</span>` : ""}
              ${item.provider ? `<span class="badge badge-sm badge-ghost">${escapeHtml(item.provider)}</span>` : ""}
              ${item.model ? `<span class="badge badge-sm badge-ghost">${escapeHtml(item.model)}</span>` : ""}
              ${item.sourceType ? `<span class="badge badge-sm badge-ghost">${escapeHtml(item.sourceType)}</span>` : ""}
              <span class="badge badge-sm badge-ghost">${new Date(item.createdAt).toLocaleString()}</span>
            </div>
            ${who ? `<div class="text-xs text-base-content/60 mb-2">From: ${escapeHtml(who)}</div>` : ""}
            ${item.comment ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Comment</label>${escapeHtml(item.comment)}</div>` : ""}
            ${sourceLink ? `<div class="text-xs text-base-content/60 mb-3">Source link: ${sourceLink}</div>` : ""}
            ${item.adminReply ? `
              <div class="bg-success/10 border border-success/30 rounded-box p-3 mb-3">
                <label class="label-text text-xs uppercase opacity-70 block mb-1">Ваш ответ${item.replyDelivered ? " · доставлен" : " · сохранён, пользователь увидит при заходе"}</label>
                <div class="text-box">${escapeHtml(item.adminReply)}</div>
              </div>` : ""}
            ${item.rating === "issue" ? `
              <div class="border-t border-base-300 pt-3 mt-1 space-y-2" data-actions="${item.id}">
                <textarea class="textarea textarea-bordered w-full textarea-sm" rows="2"
                  placeholder="Ответ пользователю${item.source === "web" ? " (web: покажется при следующем заходе)" : " (уйдёт в Telegram)"}"
                  data-reply-input="${item.id}">${item.adminReply ? escapeHtml(item.adminReply) : ""}</textarea>
                <div class="flex flex-wrap gap-2 items-center">
                  <button class="btn btn-sm btn-primary" data-reply-btn="${item.id}">Отправить ответ</button>
                  <button class="btn btn-sm btn-success btn-outline" data-status-btn="${item.id}" data-status="resolved">Решено</button>
                  <button class="btn btn-sm btn-warning btn-outline" data-status-btn="${item.id}" data-status="deferred">Отложить</button>
                  ${item.status === "new" ? "" : `<button class="btn btn-sm btn-ghost" data-status-btn="${item.id}" data-status="new">Вернуть в новые</button>`}
                  <span class="text-xs opacity-60" data-action-note="${item.id}"></span>
                </div>
              </div>` : ""}
          </div>
        `;
        listContainer.appendChild(div);
        if (item.rating === "issue") wireFeedbackActions(div, item);
      });
    }


    // Reply to a problem report, or move it between new / resolved / deferred.
    // Deferred items are re-sent to the admin's Telegram daily until they move,
    // which is the whole point of having the state.
    function wireFeedbackActions(card, item) {
      const note = card.querySelector(`[data-action-note="${item.id}"]`);
      const input = card.querySelector(`[data-reply-input="${item.id}"]`);

      function setNote(text, cls) {
        note.textContent = text;
        note.className = "text-xs " + (cls || "opacity-60");
      }

      card.querySelector(`[data-reply-btn="${item.id}"]`).addEventListener("click", async (ev) => {
        const reply = input.value.trim();
        if (!reply) { setNote("Введите текст ответа", "text-xs text-error"); return; }
        const btn = ev.currentTarget;
        btn.disabled = true;
        setNote("Отправляю…");
        try {
          const res = await apiFetch(`/api/admin/feedback/${item.id}/reply`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reply: reply }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
          setNote(data.delivered ? "Доставлено в Telegram" : (data.reason || "Сохранено"),
                  data.delivered ? "text-xs text-success" : "text-xs opacity-70");
        } catch (err) {
          setNote("Ошибка: " + err.message, "text-xs text-error");
        } finally {
          btn.disabled = false;
        }
      });

      card.querySelectorAll(`[data-status-btn="${item.id}"]`).forEach((btn) => {
        btn.addEventListener("click", async () => {
          const status = btn.dataset.status;
          btn.disabled = true;
          setNote("Сохраняю…");
          try {
            const res = await apiFetch(`/api/admin/feedback/${item.id}/status`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: status }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
            loadTab("feedback");
          } catch (err) {
            setNote("Ошибка: " + err.message, "text-xs text-error");
            btn.disabled = false;
          }
        });
      });
    }


    // --- Authentication ----------------------------------------------------
    // The server decides which control the panel shows: a password form once
    // ADMIN_PASSWORD_HASH is set, the legacy token box until then. Deciding it
    // here would let the page offer a login that cannot work.
    const loginRow = document.getElementById("loginRow");
    const tokenRow = document.getElementById("tokenRow");
    const sessionRow = document.getElementById("sessionRow");
    const adminPassword = document.getElementById("adminPassword");
    const pwLoginBtn = document.getElementById("pwLoginBtn");
    const pwLoginNote = document.getElementById("pwLoginNote");
    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn2 = document.getElementById("refreshBtn2");

    async function refreshAuthState() {
      try {
        const res = await fetch("/api/admin/session", { credentials: "same-origin" });
        const data = await res.json();
        if (data.authenticated) {
          loginRow.style.display = "none";
          tokenRow.style.display = "none";
          sessionRow.style.display = "flex";
          loadTab(currentTab);
        } else if (data.passwordConfigured) {
          loginRow.style.display = "flex";
          tokenRow.style.display = "none";
          sessionRow.style.display = "none";
        } else {
          loginRow.style.display = "none";
          tokenRow.style.display = "flex";
          sessionRow.style.display = "none";
        }
      } catch (err) {
        tokenRow.style.display = "flex";
      }
    }

    async function doLogin() {
      const password = adminPassword.value;
      if (!password) { pwLoginNote.textContent = "Введите пароль"; pwLoginNote.className = "text-sm text-error"; return; }
      pwLoginBtn.disabled = true;
      pwLoginNote.textContent = "Проверяю…";
      pwLoginNote.className = "text-sm opacity-70";
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
        adminPassword.value = "";
        pwLoginNote.textContent = "";
        await refreshAuthState();
      } catch (err) {
        pwLoginNote.textContent = err.message;
        pwLoginNote.className = "text-sm text-error";
      } finally {
        pwLoginBtn.disabled = false;
      }
    }

    pwLoginBtn.addEventListener("click", doLogin);
    adminPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" });
      location.reload();
    });
    refreshBtn2.addEventListener("click", () => loadTab(currentTab));
    refreshAuthState();

    async function searchRequestNumber() {
      const number = requestSearch.value.trim();
      if (!number) return;
      if (!requireToken()) return;
      searchResult.innerHTML = '<div class="text-center text-base-content/60 py-8">Searching...</div>';
      try {
        let res = await apiFetch(`/api/admin/translations/search/${encodeURIComponent(number)}`);
        let data = await res.json();
        if (!res.ok || !data.found) {
          res = await apiFetch(`/api/admin/web-jobs/search/${encodeURIComponent(number)}`);
          data = await res.json();
        }
        if (!res.ok) throw new Error(data.error || "Search failed");
        if (!data.found || !data.entry) throw new Error("Request not found");
        renderSearchResult(data.entry);
      } catch (err) {
        searchResult.innerHTML = `<div class="text-center text-error py-8">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderSearchResult(item) {
      const dateField = item.errorAt || item.confirmedAt || item.rejectedAt || item.createdAt;
      const isWebJob = item.jobId !== undefined;
      const langPair = isWebJob
        ? `${(item.sourceLang || "auto").toUpperCase()} → ${(item.targetLang || "-").toUpperCase()}`
        : `${(item.sourceLang || "auto").toUpperCase()} → ${item.targetLang.toUpperCase()}`;
      const sourceLink = item.sourceUrl
        ? `<a class="link link-primary break-all" href="${escapeHtml(item.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(item.sourceUrl)}</a>`
        : `<em class="text-base-content/50">No source link</em>`;
      searchResult.innerHTML = `
        <div class="card card-compact bg-base-200">
          <div class="card-body">
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="badge badge-sm ${statusBadgeClass(item.status)}">${item.status.toUpperCase()}</span>
              ${item.requestNumber ? `<span class="badge badge-sm badge-ghost" title="Public request number">#${item.requestNumber}</span>` : ""}
              <span class="badge badge-sm badge-ghost" title="Source → Target">${escapeHtml(langPair)}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.provider)}</span>
              <span class="badge badge-sm badge-ghost">${escapeHtml(item.model)}</span>
              <span class="badge badge-sm badge-ghost">${item.sourceType || "unknown"}</span>
              <span class="badge badge-sm badge-ghost">${new Date(dateField).toLocaleString()}</span>
            </div>
            ${isWebJob ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Transcription</label>${escapeHtml(item.fullText || "")}</div>` : ""}
            ${isWebJob && item.segments && item.segments.length ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Segments</label>${escapeHtml(formatSegments(item.segments))}</div>` : ""}
            ${!isWebJob ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Source</label>${escapeHtml(item.sourceText)}</div>` : ""}
            ${!isWebJob && item.status !== "error" ? `<div class="bg-base-300 rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Translation</label>${escapeHtml(item.translatedText)}</div>` : ""}
            ${item.status === "error" ? `<div class="bg-error/10 text-error rounded-box p-3 text-box mb-3"><label class="label-text text-xs uppercase opacity-70 block mb-1">Error</label>${escapeHtml(item.errorMessage || "Unknown error")}</div>` : ""}
            <div class="text-xs text-base-content/60">Source link: ${sourceLink}</div>
          </div>
        </div>
      `;
    }

    searchBtn.addEventListener("click", searchRequestNumber);
    requestSearch.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchBtn.click();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => loadTab(tab.dataset.tab));
    });

    refreshBtn.addEventListener("click", () => loadTab(currentTab));

    requireToken();
    if (adminToken.value) loadTab("pending");
  </script>
</body>
</html>
